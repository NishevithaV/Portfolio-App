<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nishevitha Venkatesh">
  <!--
    Site mark: the isometric cube from the work section, flattened to three
    facets. Black ground and white/grey faces keep it inside the B&W system;
    the lit top face carries the wine accent (#9d3d4f), the one place colour
    is allowed to sit at rest.

    Drawn as solid facets, sized to leave only a thin margin, because the
    favicon is read at 16px far more often than at 512.
  -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="1.5"/>
  <g stroke="#0a0a0a" stroke-width="1.3" stroke-linejoin="round">
    <path d="M32 7 55 19.5 32 32 9 19.5Z" fill="#9d3d4f"/>
    <path d="M9 19.5 32 32v25L9 44.5Z" fill="#f5f5f5"/>
    <path d="M55 19.5 55 44.5 32 57V32Z" fill="#8f8f8f"/>
  </g>
</svg>
